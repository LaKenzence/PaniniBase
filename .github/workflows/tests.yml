# Vérifie chaque push et chaque pull request : TypeScript, tests unitaires, build, parcours Playwright.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # Chrome est préinstallé sur les machines GitHub : pas de navigateur à télécharger
      - run: npm run test:e2e
        env:
          CI: true
          PW_CHANNEL: chrome

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
